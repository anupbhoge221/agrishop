services:
  - type: web
    name: agrishop
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrishop-db
          property: connectionString

databases:
  - name: agrishop-db
    databaseName: agrishop
    user: agrishop_user
    plan: free

